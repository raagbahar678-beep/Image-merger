name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # p4a's own internal build venv (.buildozer/.../build/venv) is created
      # with whatever `python3` is first on PATH. On this runner that now
      # resolves to Python 3.14, and p4a's `pip install -U pip` bootstrap
      # inside that fresh venv breaks under 3.14 with:
      #   ImportError: cannot import name 'BuildDependencyInstallError'
      #   from 'pip._internal.exceptions'
      # (a pip self-upgrade / entry-point mismatch — distinct from the
      # stale-venv issue #3339 already worked around below). Pin to 3.11,
      # which p4a/buildozer are known to work with, so both the outer
      # .venv and p4a's inner venv use it.
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip python3-pip python3-venv autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev build-essential
          # --system-site-packages IS required: buildozer installs its own
          # p4a build dependencies with `pip install --user` (kept out of
          # the project venv deliberately), and pip only allows --user
          # installs inside a venv when it can see the system site-packages.
          # Without this flag buildozer fails immediately with:
          #   ERROR: Can not perform a '--user' install. User site-packages
          #   are not visible in this virtualenv.
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install --upgrade pip setuptools
          .venv/bin/pip install buildozer cython

      - name: Cache buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ hashFiles('buildozer.spec') }}

      - name: Cache buildozer project directory
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-project-${{ hashFiles('buildozer.spec') }}

      - name: Build APK
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PWD/.venv/bin:$PATH"
          # Pin the pip version p4a's own internal `pip install -U pip`
          # (run inside its freshly-created per-arch build venv) is allowed
          # to upgrade to. Without this it grabs whatever is currently
          # latest on PyPI, and that self-upgrade has been landing in an
          # inconsistent state - e.g.:
          #   ImportError: cannot import name 'open_rich_spinner' from
          #   'pip._internal.cli.spinners'
          #   ImportError: cannot import name 'BuildDependencyInstallError'
          #   from 'pip._internal.exceptions'
          # PIP_CONSTRAINT applies to every pip invocation in the
          # environment, so this covers that nested call even though we
          # don't control its command line directly.
          echo "pip==24.3.1" > /tmp/pip-constraint.txt
          export PIP_CONSTRAINT=/tmp/pip-constraint.txt
          python3 --version
          java -version
          set -o pipefail
          # Remove any stale per-arch build/venv left behind by a previous
          # failed run. p4a (as of the 2026.05.09 release) creates this venv
          # with `python -m venv venv` (no --clear) and then runs
          # `pip install -U pip` inside it; if a broken/partial venv survives
          # from an earlier failed build (restored here via the cache step
          # above), the upgrade can leave pip's own internals inconsistent,
          # causing errors like "cannot import name 'BuildDependencyInstallError'
          # from 'pip._internal.exceptions'" on every subsequent run even
          # though the underlying build itself is fine. Deleting it forces a
          # clean venv each time; this is cheap since venv creation is fast
          # relative to the rest of the build. See:
          # https://github.com/kivy/python-for-android/issues/3339
          find .buildozer -maxdepth 6 -type d -path '*/build/venv' -exec rm -rf {} + 2>/dev/null || true
          .venv/bin/buildozer -v android debug 2>&1 | tee build.log

      - name: Save build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Log
          path: build.log
          if-no-files-found: ignore

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: MyKivyApp-APK
          path: bin/*.apk
          if-no-files-found: error

